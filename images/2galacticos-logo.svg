<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#16265a"/>
      <stop offset="70%" stop-color="#0a1633"/>
      <stop offset="100%" stop-color="#060d22"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d97a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8861f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="300" cy="300" r="280" fill="url(#bg)" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="300" cy="300" r="248" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.45"/>
  <!-- star burst behind -->
  <g opacity="0.25" stroke="url(#gold)" stroke-width="1.5" fill="none">
    <circle cx="300" cy="300" r="190"/>
    <circle cx="300" cy="300" r="160"/>
  </g>
  <!-- soccer ball -->
  <g filter="url(#glow)">
    <circle cx="300" cy="300" r="120" fill="#0a1633" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="300,228 360,272 338,338 262,338 240,272" fill="url(#gold)"/>
    <polygon points="300,228 240,272 220,210 280,170 340,170 360,272" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <polygon points="338,338 360,272 414,310 388,372 320,400" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <polygon points="262,338 240,272 186,310 212,372 280,400" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>
  <!-- wordmark -->
  <text x="300" y="498" text-anchor="middle"
        font-family="Montserrat, Arial Black, sans-serif"
        font-weight="900" font-size="58"
        letter-spacing="6" fill="url(#gold)">GALACTICOS</text>
  <text x="300" y="540" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-weight="700" font-size="20"
        letter-spacing="12" fill="#ffffff" opacity="0.85">SOCCER CLUB</text>
</svg>
